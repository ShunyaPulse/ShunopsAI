name: "ShunopsAI Cloud Ops Dispatch (Cloud Run, OCI Redis, Neon, Cloudflare, Kaggle)"

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: "Target Cloud Service / Component"
        required: true
        type: choice
        default: "all_services_health_check"
        options:
          - "all_services_health_check"
          - "google_cloud_run"
          - "redis_on_oci"
          - "neon_postgres"
          - "cloudflare_workers_ai"
          - "kaggle_gpu_pipeline"
          - "github_gitops_remediation"
      task_goal:
        description: "Specific task / action to execute on the selected service"
        required: true
        default: "Perform full health check and auto-heal any degraded services"
      max_steps:
        description: "Max agent reasoning steps (default: 8)"
        required: false
        default: "8"
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  execute-cloud-ops:
    name: "Execute Cloud Operations Task"
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'cloud-ops') || contains(github.event.issue.labels.*.name, 'shunops') || contains(github.event.issue.labels.*.name, 'shunopsai')))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python & Kaggle CLI
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python CLI tools
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute Cloud Agent Task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SARALGATI_DATABASE_URL: ${{ secrets.SARALGATI_DATABASE_URL }}
          KANBAN_DATABASE_URL: ${{ secrets.KANBAN_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ORACLE_VM_IP: ${{ secrets.ORACLE_VM_IP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
          SARALGATI_APP_URL: ${{ secrets.SARALGATI_APP_URL }}
          KANBAN_APP_URL: ${{ secrets.KANBAN_APP_URL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          VIDEO_TOKEN: ${{ secrets.VIDEO_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_DEFAULT_REGION: ${{ secrets.GCP_DEFAULT_REGION }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          TARGET_SERVICE: ${{ github.event.inputs.target_service || 'issue-trigger' }}
          TASK_GOAL: ${{ github.event.inputs.task_goal || github.event.issue.title }}
        run: |
          echo "🎯 [Cloud Ops] Target: $TARGET_SERVICE"
          echo "🎯 [Cloud Ops] Goal: $TASK_GOAL"

          npx tsx agent.ts "Target Service: $TARGET_SERVICE. Action: $TASK_GOAL"
