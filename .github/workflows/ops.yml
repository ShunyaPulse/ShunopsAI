name: "ShunopsAI Cloud Operations & Sentinel"

on:
  schedule:
    # Automated scheduled monitoring every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_service:
        description: "Target Cloud Service"
        required: true
        type: choice
        default: "all_services_health_check"
        options:
          - "all_services_health_check"
          - "google_cloud_run"
          - "redis_on_oci"
          - "neon_postgres"
          - "cloudflare_workers_ai"
          - "kaggle_gpu_pipeline"
          - "github_gitops_remediation"
          - "code_scanning_alerts_remediation"
      task_goal:
        description: "Action or task to perform on the service"
        required: true
        default: "Perform full health check and auto-heal any degraded services"
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cloud-ops:
    name: "Cloud Operations Execution"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python & Kaggle CLI
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python CLI tools
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Sentinel Health Check (Scheduled)
        if: github.event_name == 'schedule'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SARALGATI_DATABASE_URL: ${{ secrets.SARALGATI_DATABASE_URL }}
          KANBAN_DATABASE_URL: ${{ secrets.KANBAN_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
          SARALGATI_APP_URL: ${{ secrets.SARALGATI_APP_URL }}
          KANBAN_APP_URL: ${{ secrets.KANBAN_APP_URL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          VIDEO_TOKEN: ${{ secrets.VIDEO_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FAIL_ON_DOWN: "true"
        run: |
          npx tsx src/cron/sentinel-cron.ts

      - name: Report Incident on Scheduled Outage
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 [Sentinel Outage] Cloud Service Alert at ${new Date().toISOString()}`;
            const body = `### Infrastructure Sentinel Outage Detected\n\nOne or more services (Cloud Run, OCI Redis, Neon, Cloudflare AI, Kaggle) reported failure.\n\nView [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for diagnostics.`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['incident', 'cloud-ops', 'bug']
            });

      - name: Execute Manual Dispatch or Issue Task
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SARALGATI_DATABASE_URL: ${{ secrets.SARALGATI_DATABASE_URL }}
          KANBAN_DATABASE_URL: ${{ secrets.KANBAN_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ORACLE_VM_IP: ${{ secrets.ORACLE_VM_IP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
          SARALGATI_APP_URL: ${{ secrets.SARALGATI_APP_URL }}
          KANBAN_APP_URL: ${{ secrets.KANBAN_APP_URL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          VIDEO_TOKEN: ${{ secrets.VIDEO_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_DEFAULT_REGION: ${{ secrets.GCP_DEFAULT_REGION }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TARGET_SERVICE: ${{ github.event.inputs.target_service || 'issue-trigger' }}
          TASK_GOAL: ${{ github.event.inputs.task_goal || github.event.issue.title }}
        run: |
          echo "🎯 [Cloud Ops] Target: $TARGET_SERVICE"
          echo "🎯 [Cloud Ops] Goal: $TASK_GOAL"
          if [ "$TARGET_SERVICE" = "code_scanning_alerts_remediation" ]; then
            npx tsx src/tools/code-scanner-resolver.ts 10
          else
            npx tsx agent.ts "Target Service: $TARGET_SERVICE. Action: $TASK_GOAL"
          fi
