name: "AI Agent Auto-Resolver (PRs, Code Scanning, Dependabot, CI Failures)"

on:
  # Trigger when a PR is opened by Dependabot or marked for auto-resolve
  pull_request:
    types: [opened, synchronize, labeled]
  # Trigger when a GitHub Actions workflow fails
  workflow_run:
    workflows: ["CI/CD & Security Auditing (Semgrep, Trivy, Gitleaks, CodeQL, Promptfoo)", "CI/CD & GitOps Verification"]
    types: [completed]
  # Trigger when a Code Scanning Alert is created (if repo events support it)
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write

jobs:
  auto-resolve:
    name: "Autonomous AI Agent Remediation"
    # Run if Dependabot PR, or workflow failure, or labeled 'auto-resolve' / 'shunops' / 'shunopsai'
    if: >
      (github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'auto-resolve'))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.issue.labels.*.name, 'shunops') || contains(github.event.issue.labels.*.name, 'shunopsai')))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python CLI tools
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Install Node Dependencies
        run: npm ci

      - name: Determine Remediation Goal
        id: goal-builder
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "GOAL=Review and resolve Pull Request #${{ github.event.pull_request.number }}: '${{ github.event.pull_request.title }}'. Verify compatibility, run typecheck, and ensure all tests pass." >> $GITHUB_OUTPUT
            echo "BRANCH=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "GOAL=The CI workflow '${{ github.event.workflow_run.name }}' failed on run #${{ github.event.workflow_run.id }}. Inspect the latest code, diagnose compilation/security/test failures, fix the code, verify with npm run typecheck, and push the fix directly." >> $GITHUB_OUTPUT
            echo "BRANCH=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          else
            echo "GOAL=Resolve GitHub Issue #${{ github.event.issue.number }}: '${{ github.event.issue.title }}'. Details: ${{ github.event.issue.body }}. Implement the fix, run typecheck, and commit the fix to main." >> $GITHUB_OUTPUT
            echo "BRANCH=main" >> $GITHUB_OUTPUT
          fi

      - name: Execute OpenRouter Agent Remediation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.goal-builder.outputs.BRANCH }}
          TASK_GOAL: ${{ steps.goal-builder.outputs.GOAL }}
        run: |
          git config --global user.name "ShunopsAI-AutoResolver[bot]"
          git config --global user.email "shunopsai-agent@users.noreply.github.com"
          
          echo "🤖 [Auto-Resolver] Target Goal: $TASK_GOAL"
          echo "🤖 [Auto-Resolver] Target Branch: $TARGET_BRANCH"

          npx tsx agent.ts "$TASK_GOAL"

          # Verify if git diff exists and push directly to target branch
          if [ -n "$(git status --porcelain)" ]; then
            echo "Found resolved code modifications. Committing and pushing..."
            npm run typecheck
            git add -A
            git commit -m "fix(autonomous): auto-resolved by OpenRouter AI agent [skip ci]"
            git push origin HEAD:$TARGET_BRANCH
          else
            echo "No code changes required or modifications already cleanly applied."
          fi
