name: "Deploy ShunopsAI to Google Cloud Run"

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "server.ts"
      - "agent.ts"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "tsconfig.json"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:

concurrency:
  group: cloudrun-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: "Build Container & Deploy to Cloud Run"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck Verification
        run: npm run typecheck

      # Build and push to GitHub Container Registry (GHCR) - Zero Cloud Build dependency
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Authenticate to GCP using Service Account
      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Deploy pre-built GHCR image directly to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "🚀 Deploying $IMAGE to Cloud Run (asia-south1)..."
          
          gcloud run deploy shunopsai \
            --image=$IMAGE \
            --project=sage-webbing-422513-q0 \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --update-env-vars=NODE_ENV=production,HOST=0.0.0.0,GOOGLE_CLIENT_ID=685823552970-phqjqt3cc613h69kat0rljbaikf8k6kd.apps.googleusercontent.com,CLOUDFLARE_TURNSTILE_SITE_KEY=0x4AAAAAAFVaFzGbMCgv2_Kr

          echo "✅ Traffic switch to latest revision..."
          gcloud run services update-traffic shunopsai \
            --project=sage-webbing-422513-q0 \
            --region=asia-south1 \
            --to-latest
