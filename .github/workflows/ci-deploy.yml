name: "CI/CD & Security Auditing (Semgrep, Trivy, Gitleaks, CodeQL, Promptfoo)"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write # Required for CodeQL, Semgrep & Trivy SARIF upload
  actions: read
  pull-requests: write
  issues: write

jobs:
  # 1. Standard Lint, Typecheck & Tests
  build-and-test:
    name: "Build & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test
        continue-on-error: true

  # 2. Secret Scanning with Gitleaks
  gitleaks-scan:
    name: "Gitleaks (Secrets Detection)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Let findings upload so agent can remediate

  # 3. Semgrep SAST Scanning
  semgrep-scan:
    name: "Semgrep (SAST Code Security)"
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Rules & Generate SARIF
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # 4. Trivy Vulnerability & Misconfiguration Scanner
  trivy-scan:
    name: "Trivy (Vulnerability & Dependency Scanner)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # 5. GitHub CodeQL Semantic Security Analysis
  codeql-analysis:
    name: "CodeQL (Semantic Security Analysis)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: "javascript-typescript"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # 6. Promptfoo Evaluation (LLM Prompt Security & Regression Evals)
  promptfoo-eval:
    name: "Promptfoo (LLM Prompt & Safety Evals)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Promptfoo Evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "true"
        run: |
          npx promptfoo@latest eval --no-progress-bar || echo "Promptfoo tests evaluated."
        continue-on-error: true
