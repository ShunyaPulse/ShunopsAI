name: "CI/CD & Security Auditing (Semgrep, Trivy, Gitleaks, CodeQL, Promptfoo)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  pull-requests: write
  issues: write

jobs:
  validate-and-audit:
    name: "Unified Verification & Security Shield"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python CLI Tools
        run: |
          python -m pip install --upgrade pip
          pip install kaggle semgrep

      - name: Install Node Dependencies
        run: npm ci

      # 1. Typecheck
      - name: TypeScript Typecheck
        run: npm run typecheck

      # 2. Secret Scanning (Gitleaks)
      - name: Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 3. Initialize CodeQL
      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: "javascript-typescript"

      # 4. SAST Code Security (Semgrep)
      - name: Semgrep Code Security Scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true

      # 5. Upload Semgrep SARIF
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      # 6. Vulnerability Scanning (Trivy)
      - name: Install & Run Trivy Vulnerability Scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy fs --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH .
        continue-on-error: true

      # 7. Upload Trivy SARIF
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

      # 8. Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      # 9. Promptfoo Prompt Safety Evaluation
      - name: Promptfoo LLM Prompt Evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "true"
        run: |
          npx promptfoo@latest eval --no-progress-bar || echo "Promptfoo evaluation complete."
        continue-on-error: true

      # 10. Autonomous AI Remediation (Runs only if failures exist or on issue/PR trigger)
      - name: Autonomous AI Remediation
        if: failure() || github.event_name == 'issues' || (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]')
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "ShunopsAI-AutoResolver[bot]"
          git config --global user.email "shunopsai-agent@users.noreply.github.com"
          
          TASK_GOAL="Inspect recent CI/security scan failures, verify codebase with npm run typecheck, and apply necessary code fixes."
          if [ "$EVENT_NAME" = "issues" ]; then
            TASK_GOAL="Resolve GitHub Issue #$ISSUE_NUMBER: '$ISSUE_TITLE'. Details: $ISSUE_BODY"
          fi

          echo "🤖 [Auto-Remediation] Executing: $TASK_GOAL"
          npx tsx agent.ts "$TASK_GOAL"

          if [ -n "$(git status --porcelain)" ]; then
            npm run typecheck
            git add -A
            git commit -m "fix(autonomous): auto-resolved by ShunopsAI [skip ci]"
            TARGET_BRANCH="${REF_NAME:-main}"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
