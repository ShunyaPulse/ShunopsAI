name: "Services Sentinel (Cloud Run, OCI Redis, Neon, Cloudflare, Kaggle)"

on:
  schedule:
    # Free scheduled monitoring every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sentinel-scan:
    name: "Scan Cloud Run, OCI Redis, Neon, Cloudflare, Kaggle"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python & Kaggle
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python Kaggle
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Infrastructure Health Check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SARALGATI_DATABASE_URL: ${{ secrets.SARALGATI_DATABASE_URL }}
          KANBAN_DATABASE_URL: ${{ secrets.KANBAN_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
          SARALGATI_APP_URL: ${{ secrets.SARALGATI_APP_URL }}
          KANBAN_APP_URL: ${{ secrets.KANBAN_APP_URL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          VIDEO_TOKEN: ${{ secrets.VIDEO_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FAIL_ON_DOWN: "true"
        run: |
          npx tsx src/cron/sentinel-cron.ts

      - name: Report Incident on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 [Sentinel Outage] Cloud Service Alert at ${new Date().toISOString()}`;
            const body = `### Infrastructure Sentinel Outage Detected\n\nOne or more services (Cloud Run, OCI Redis, Neon, Cloudflare AI, Kaggle) reported failure.\n\nView [workflow run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for diagnostics.`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['incident', 'cloud-ops', 'bug']
            });
